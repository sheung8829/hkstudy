services:
  # 後端服務 (TTS API + 資料庫)
  - type: web
    name: studyweb-backend
    env: node
    plan: free # 指定免費方案
    buildCommand: npm install
    startCommand: npx tsx server.ts
    envVars:
      - key: PORT
        value: 10000
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false # 需在 Render 控制台手動填入 Firebase Service Account JSON
      - key: VITE_API_URL
        fromService:
          type: web
          name: studyweb-backend
          property: url

  # 前端靜態網站 (可選：如果您想把前端也搬過來，如果不搬，這段可以忽略，前端繼續放 Vercel 也可以)
  - type: static
    name: studyweb-frontend
    env: static
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: studyweb-backend
          property: url
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false # 需在 Render 控制台手動填入
